apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-service
  labels:
    app: orders-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: orders-service

  template:
    metadata:
      labels:
        app: orders-service

    spec:
      containers:
        - name: orders-service
          image: ghcr.io/inijoy/orders-service:0.2.0

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5